name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Smoke (no kimi login required)
        run: npm run smoke

      - name: Companion CLI --version matches package
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(node plugins/kimi/scripts/kimi-companion.mjs --version | tr -d '\r')
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
