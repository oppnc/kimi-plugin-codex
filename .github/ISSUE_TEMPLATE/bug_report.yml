name: Bug report
description: Report a problem with kimi-plugin-codex
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues, use [Security Advisories](https://github.com/oppnc/kimi-plugin-codex/security/advisories/new) instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `package.json` / companion `--version` (e.g. 0.2.1)
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: OpenAI Codex (local), companion-only, …
      placeholder: OpenAI Codex
    validations:
      required: true
  - type: input
    id: kimi
    attributes:
      label: Kimi Code version
      description: Output of `kimi --version` if available
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, slash commands, or prompts that trigger the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stderr tails or companion JSON if relevant
    validations:
      required: true